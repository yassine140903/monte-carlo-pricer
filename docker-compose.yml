services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-monte_carlo_pricer}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-monte_carlo_pricer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    # Pinned rather than :latest — MLflow's host validation (see
    # --allowed-hosts below) arrived in a minor release and silently turned
    # every tracking call into a 403.
    image: ghcr.io/mlflow/mlflow:v3.15.1
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    # --allowed-hosts: the backend reaches the server as http://mlflow:5000,
    # and a Docker service name is not in MLflow's default allow-list
    # (localhost + private IPs), so every request came back 403 without it.
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # These three override whatever .env says, because .env describes the
      # host's view (localhost, and a published DB port that may be remapped
      # to dodge a native Postgres install). Inside the network the services
      # are reachable by name on their real ports.
      DB_HOST: postgres
      DB_PORT: 5432
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    healthcheck:
      # No curl in python:3.12-slim, and the interpreter is right there.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health")
      interval: 10s
      timeout: 5s
      retries: 10
      # The first run fetches three years of history for three tickers before
      # uvicorn binds; without this the container is marked unhealthy first.
      start_period: 90s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  mlflow-data:
