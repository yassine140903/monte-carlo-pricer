server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API calls. The trailing slash on proxy_pass strips the location prefix,
    # so /api/data/tickers reaches the backend as /data/tickers — the routers
    # are mounted at the root and stay unaware they sit behind a proxy.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A 100,000-path pricing request is a long synchronous call; the
        # default 60s read timeout would cut it off mid-simulation.
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: client-side routes are not files on disk, so anything that
    # is not a real asset gets index.html and React Router takes it from there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
